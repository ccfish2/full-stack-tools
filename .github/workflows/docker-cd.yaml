name: Deploy & Verify

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to latest)'
        required: false
        default: 'latest'

env:
  RELEASE_NAME: fullstack-app-rel
  CHART_REPO_URL: https://ccfish2.github.io/charts/   # GitHub Pages index for the charts repo
  CHART_NAME: fullstackapp/fullstack-app
  IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME }}/full-stack-tools-backend

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          # workflow_run gives us the exact commit CI just built and pushed;
          # workflow_dispatch lets you deploy an arbitrary tag manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: fullstack-ci

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Add fullstackapp Helm repo
        run: |
          helm repo add fullstackapp "${{ env.CHART_REPO_URL }}"
          helm repo update

      - name: Install chart
        run: |
          helm install "${{ env.RELEASE_NAME }}" "${{ env.CHART_NAME }}" \
            --set image.repository="${{ env.IMAGE_REPO }}" \
            --set image.tag="${{ steps.tag.outputs.tag }}" \
            --wait --timeout 120s

      - name: Show cluster state
        if: always()
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment \
            -l app.kubernetes.io/instance="${{ env.RELEASE_NAME }}" \
            --timeout=90s

      - name: Port-forward service and run smoke test
        run: |
          SVC=$(kubectl get svc -l app.kubernetes.io/instance="${{ env.RELEASE_NAME }}" \
                -o jsonpath='{.items[0].metadata.name}')
          echo "Forwarding svc/$SVC 8000:8000"
          kubectl port-forward "svc/$SVC" 8000:8000 &
          FWD_PID=$!
          sleep 5

          curl -v "http://127.0.0.1:8000/api/v1/hello"

          kill $FWD_PID

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl get pods
          for p in $(kubectl get pods -l app.kubernetes.io/instance="${{ env.RELEASE_NAME }}" -o name); do
            echo "== logs: $p =="
            kubectl logs "$p" --all-containers --tail=200 || true
          done