apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fullstack-gateway
  namespace: dolphin
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: fullstack-tls
      allowedRoutes:
        namespaces:
          from: Same
---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: fullstack-route
      namespace: dolphin
    spec:
      parentRefs:
        - name: fullstack-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api/v1
            - path:
                type: PathPrefix
                value: /api/v2
          backendRefs:
            - name: fullstack-app-rel
              port: 8000